x-enrichment:
  date: '2026-08-12'
  status: enriched
  artifacts_added: 10
  pass: local-v1
  note: >-
    Round 2 overturned round 1. Round 1 recorded that every /.well-known/ path 404s and
    that CoolerX has no machine-readable surface. Two paths on the apex host in fact
    return 200 JSON — RFC 8414 OAuth authorization server metadata and RFC 9728 protected
    resource metadata — and the latter names a live, OAuth-gated MCP endpoint at
    https://coolerx.com/wp-json/mcp/mcp-oauth-server. Both documents are saved verbatim.
    The MCP surface belongs to the WordPress marketing site (MCP Adapter plugin over the
    WordPress Abilities API), not to the CoolerX retail-media platform, and every artifact
    in this repo says so. The retail-media platform itself remains sales-gated: no
    developer portal, no OpenAPI, no pricing, and api.coolerx.com / portal.coolerx.com
    still refuse TCP connections.
