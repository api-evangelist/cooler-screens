aid: cooler-screens
name: CoolerX
description: 'CoolerX — formerly Cooler Screens — is an in-store retail media and merchandising
  technology company that turns cooler doors, endcaps, checkout coolers and pharmacy fixtures
  into IoT-connected digital screens. The platform pairs an AI "Intent Engine" for contextual
  targeting and conversion-funnel optimization with a Dynamic Content Engine for creative
  optimization, alongside campaign management, real-time measurement, and a data integration
  hub for product, price, promotion and context data. It is deployed with retailers including
  Kroger, Walgreens, Giant Eagle''s GetGo, Chevron and Western Union, and is built on Microsoft
  Azure with NVIDIA, BOE, LG, Samsung and Foxconn as hardware and infrastructure partners.
  CoolerX sells to retailers and brands through a demo and sales motion; as of this profile it
  publishes no public developer program, API reference, SDK, or machine-readable specification.'
