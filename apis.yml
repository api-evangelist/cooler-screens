apis:
- name: CoolerX Website MCP Server
  description: >-
    A live, OAuth-protected Model Context Protocol endpoint served by CoolerX from its own
    apex host and discovered through the RFC 9728 protected-resource metadata document at
    https://coolerx.com/.well-known/oauth-protected-resource. It is published by the
    WordPress MCP Adapter running on the coolerx.com marketing site, which exposes that
    site''s WordPress Abilities API as MCP tools. It is a CONTENT surface for the website —
    NOT the CoolerX retail-media platform, Intent Engine or Dynamic Content Engine, which
    remain behind a sales gate at the unreachable api.coolerx.com and portal.coolerx.com.
    Anonymous tools/list returns 401 with a conforming Bearer challenge, so the tool list is
    not enumerated in this profile. The endpoint is undocumented on the CoolerX site and
    coolerx.com serves a TLS certificate that expired 2025-06-10, so a certificate-validating
    client cannot reach it.
  humanURL: https://coolerx.com/
  baseURL: https://coolerx.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - OAuth
  - Content Management
  - WordPress
