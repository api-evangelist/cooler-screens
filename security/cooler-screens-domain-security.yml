recheck_note: >-
  Re-probed 2026-08-12. Every finding below still holds. The apex certificate
  (CN=coolerx.com, GeoTrust Global TLS RSA4096 SHA256 2022 CA1, notAfter Jun 10 23:59:59
  2025 GMT) remains expired — 14 months past expiry — and openssl still returns
